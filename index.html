<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="In this 2D game, you fight against hordes of chickens and a giant monster chicken in the Mexican pampas. Defeat them and enjoy the clucking and squawking of the crazy feathered creatures!">
    <link rel="icon" type="image/x-icon" href="./assets/favicon.png">
    <title>El pollo loco</title>
    <link rel="stylesheet" href="style.css">
    <script src="./constants/statusBarImages.js"></script>
    <script src="./constants/collectible-Images.js"></script>
    <script src="./constants/enemies-Images.js"></script>
    <script src="./constants/character-Images.js"></script>
    <script src="./models/sounds.class.js"></script>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/collectable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/baby-chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/dead-chicken.class.js"></script>
    <script src="./models/dead-babychicken.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js" defer></script>
    <script src="./js/templates.js"></script>
  </head>

  <body onload="init()">
    <div class="container">
      <picture class="bg-picture">
        <source media="(min-width: 1200px)" srcset="./assets/backgrounds/desert-cacti-nature-xl.png"/>
        <source media="(min-width: 800px)" srcset="./assets/backgrounds/desert-cacti-nature-l.png"/>
        <source media="(min-width: 480px)" srcset="./assets/backgrounds/desert-cacti-nature-m.png"/>
        <source media="(min-width: 320px)" srcset="./assets/backgrounds/desert-cacti-nature-s.png"/>
        <img src="./assets/backgrounds/desert-cacti-nature-xl.png" alt="graphic of a desert" class="bg-image">
      </picture>

      <div class="display">
        <h1 id="title" class="d-none">El pollo loco</h1>
        <div id="frame" class="frame">
          <canvas id="canvas" width="720" height="480" class="d-none"></canvas>
          <div id="overlay" class="overlay">
            <img src="./img/9_intro_outro_screens/start/startscreen_1.png" alt="start image El Pollo loco">
          </div>
        </div>
      </div>
          
      <div id="infoBtns" class="buttons-div index-One">
        <button class="yellow-button big" onclick="displayContent('story')">Story</button>
        <img src="./assets/dancing-cactus.gif" alt="dancing cactus" class="cactus" >
        <img id="soundIcon" src="./assets/volume_off_brown.png" class="yellow-button circle icon sound">
        <button class="yellow-button big" onclick="displayContent('credits')">Credits</button>
      </div>

      <div id="gameBtns" class="d-none">
      </div>
    </div>
  </body>
</html>
